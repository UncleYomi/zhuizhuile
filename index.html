<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个可以更换动物和目标的追逐小游戏" />
    <title>动物追追乐</title>
    <link rel="stylesheet" href="style.css?v=0.9.0" />
  </head>
  <body>
    <main class="game-shell" data-game-state="idle">
      <header class="game-header">
        <div class="title-block">
          <p class="eyebrow">我们一起做的小游戏</p>
          <h1>动物追追乐</h1>
        </div>
        <div class="game-status">
          <div class="quick-controls" aria-label="游戏快捷控制">
            <button
              id="sound-button"
              class="utility-button"
              type="button"
              aria-pressed="true"
              aria-label="关闭音效"
            >
              <span id="sound-icon" aria-hidden="true">🔊</span>
              <span class="control-label">音效</span>
            </button>
            <button
              id="pause-button"
              class="utility-button"
              type="button"
              aria-label="暂停游戏"
              disabled
            >
              <span id="pause-icon" aria-hidden="true">⏸</span>
              <span id="pause-label" class="control-label">暂停</span>
            </button>
          </div>
          <div class="score-card" aria-live="polite">
            <span class="score-value">
              <small>本局</small>
              <strong id="score">0</strong>
            </span>
            <span class="score-divider" aria-hidden="true"></span>
            <span class="score-value">
              <small>最高</small>
              <strong id="best-score">0</strong>
            </span>
          </div>
        </div>
      </header>

      <section class="game-card" aria-label="动物追追乐游戏区域">
        <div class="canvas-wrap">
          <canvas
            id="game-canvas"
            width="400"
            height="400"
            tabindex="0"
            aria-label="动物追追乐游戏地图"
          ></canvas>
          <div id="game-message" class="game-message" aria-hidden="false">
            <p id="message-title" class="message-title">准备好了吗？</p>
            <p id="message-detail">
              <span class="keyboard-copy">抓到目标会变长，注意不要撞墙。</span>
              <span class="touch-copy">在游戏区域滑动控制方向。</span>
            </p>
            <button id="message-action" class="message-action" type="button">开始游戏</button>
          </div>
        </div>

        <div class="control-panel">
          <div class="picker-triggers">
            <button
              id="character-picker"
              class="picker-trigger"
              type="button"
              data-picker="character"
              aria-haspopup="dialog"
              aria-controls="option-dialog"
            >
              <span class="picker-label">选择主角</span>
              <span class="picker-current">
                <span id="character-icon" class="picker-icon" aria-hidden="true">🐍</span>
                <img id="character-image" class="picker-image" alt="" hidden />
                <strong id="character-name">小蛇</strong>
              </span>
              <span class="picker-action">更换</span>
            </button>

            <button
              id="target-picker"
              class="picker-trigger"
              type="button"
              data-picker="target"
              aria-haspopup="dialog"
              aria-controls="option-dialog"
            >
              <span class="picker-label">选择目标</span>
              <span class="picker-current">
                <span id="target-icon" class="picker-icon" aria-hidden="true">🍎</span>
                <img id="target-image" class="picker-image" alt="" hidden />
                <strong id="target-name">苹果</strong>
              </span>
              <span class="picker-action">更换</span>
            </button>
          </div>

          <fieldset class="difficulty-picker">
            <legend>选择难度</legend>
            <div class="difficulty-options" role="group" aria-label="游戏难度">
              <button
                class="difficulty-option"
                type="button"
                data-difficulty="easy"
                aria-pressed="true"
              >
                简单
              </button>
              <button
                class="difficulty-option"
                type="button"
                data-difficulty="medium"
                aria-pressed="false"
              >
                中等
              </button>
              <button
                class="difficulty-option"
                type="button"
                data-difficulty="hard"
                aria-pressed="false"
              >
                困难
              </button>
            </div>
          </fieldset>

          <button id="start-button" class="start-button" type="button">开始游戏</button>
          <p class="instructions">
            <span class="keyboard-copy">使用键盘的上下左右键控制方向</span>
            <span class="touch-copy">在游戏区域向上下左右滑动</span>
          </p>
        </div>
      </section>
    </main>

    <dialog id="option-dialog" class="option-dialog" aria-labelledby="dialog-title">
      <div class="dialog-card">
        <header class="dialog-header">
          <h2 id="dialog-title">选择主角</h2>
          <button id="dialog-close" class="dialog-close" type="button" aria-label="关闭选择面板">
            ×
          </button>
        </header>
        <div id="dialog-options" class="dialog-options"></div>
        <div class="custom-upload">
          <button id="custom-upload-button" class="custom-upload-button" type="button">
            ＋ 添加自定义主角
          </button>
          <p id="custom-upload-help">图片只保存在当前设备，不会上传。</p>
          <p id="custom-upload-status" class="custom-upload-status" role="status"></p>
          <input id="custom-file-input" type="file" accept="image/*" hidden />
        </div>
      </div>
    </dialog>

    <script src="src/game-engine.js?v=0.9.0"></script>
    <script src="src/sound.js?v=0.9.0"></script>
    <script src="src/player-data.js?v=0.9.0"></script>
    <script src="src/game.js?v=0.9.0"></script>
  </body>
</html>
