<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个可以更换动物和目标的追逐小游戏" />
    <title>动物追追乐</title>
    <link rel="stylesheet" href="style.css?v=0.3.0" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">我们一起做的小游戏</p>
          <h1>动物追追乐</h1>
        </div>
        <div class="score-card" aria-live="polite">
          <span>得分</span>
          <strong id="score">0</strong>
        </div>
      </header>

      <section class="game-card" aria-label="动物追追乐游戏区域">
        <div class="canvas-wrap">
          <canvas
            id="game-canvas"
            width="400"
            height="400"
            aria-label="动物追追乐游戏地图"
          ></canvas>
          <div id="game-message" class="game-message" aria-hidden="false">
            <p id="message-title" class="message-title">准备好了吗？</p>
            <p id="message-detail">抓到目标会变长，注意不要撞墙。</p>
          </div>
        </div>

        <div class="customization-panel">
          <fieldset class="choice-picker">
            <legend>选择主角</legend>
            <div class="choice-options" role="group" aria-label="主角">
              <button
                class="choice-option character-option"
                type="button"
                data-character="snake"
                aria-pressed="true"
              >
                <span class="option-icon" aria-hidden="true">🐍</span>
                小蛇
              </button>
              <button
                class="choice-option character-option"
                type="button"
                data-character="cat"
                aria-pressed="false"
              >
                <span class="option-icon" aria-hidden="true">🐱</span>
                小猫
              </button>
            </div>
          </fieldset>

          <fieldset class="choice-picker">
            <legend>选择目标</legend>
            <div class="choice-options" role="group" aria-label="目标">
              <button
                class="choice-option target-option"
                type="button"
                data-target="apple"
                aria-pressed="true"
              >
                <span class="option-icon" aria-hidden="true">🍎</span>
                苹果
              </button>
              <button
                class="choice-option target-option"
                type="button"
                data-target="mouse"
                aria-pressed="false"
              >
                <span class="option-icon" aria-hidden="true">🐭</span>
                老鼠
              </button>
            </div>
          </fieldset>
        </div>

        <fieldset class="difficulty-picker">
          <legend>选择难度</legend>
          <div class="difficulty-options" role="group" aria-label="游戏难度">
            <button
              class="difficulty-option"
              type="button"
              data-difficulty="easy"
              aria-pressed="true"
            >
              简单<small>慢一点</small>
            </button>
            <button
              class="difficulty-option"
              type="button"
              data-difficulty="medium"
              aria-pressed="false"
            >
              中等<small>当前速度</small>
            </button>
            <button
              class="difficulty-option"
              type="button"
              data-difficulty="hard"
              aria-pressed="false"
            >
              困难<small>快一点</small>
            </button>
          </div>
          <p id="difficulty-note" class="difficulty-note" aria-live="polite">
            简单模式速度较慢，适合先熟悉玩法。
          </p>
        </fieldset>

        <button id="start-button" class="start-button" type="button">开始游戏</button>
        <p class="instructions">使用键盘的上下左右键控制方向</p>
      </section>
    </main>

    <script src="src/game-engine.js?v=0.3.0"></script>
    <script src="src/game.js?v=0.3.0"></script>
  </body>
</html>
